name: Compilar GluttonIA APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el codigo de GitHub
      uses: actions/checkout@v4

    - name: Configurar Entorno de Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Dar permisos de ejecucion al compilador
      run: chmod +x gradlew

    - name: Compilar e instalar APK (Debug)
      run: ./gradlew assembleDebug

    - name: Subir el archivo APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: GluttonIA-App-Debug
        path: app/build/outputs/apk/debug/*.apk
